name: nex

services:
  postgres:
    image: postgres:17
    container_name: nex-postgres
    environment:
      POSTGRES_USER: nex
      POSTGRES_PASSWORD: nex
      POSTGRES_DB: nex
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nex_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nex -d nex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nex_pg_data:
