<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>관리자 로그인</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #131517; color: #f2f4f6; font-family: sans-serif; }
    form { width: min(360px, calc(100vw - 32px)); background: #1f2327; border: 1px solid #2e343a; border-radius: 16px; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 16px; color: #9aa3ad; font-size: 13px; }
    label { display: block; margin: 12px 0 6px; font-size: 12px; font-weight: 700; color: #9aa3ad; }
    input { width: 100%; box-sizing: border-box; height: 40px; border-radius: 8px; border: 1px solid #2e343a; background: #101214; color: #f2f4f6; padding: 0 12px; }
    button { width: 100%; margin-top: 18px; height: 42px; border: 0; border-radius: 8px; background: #22e07a; color: #07251a; font-weight: 800; cursor: pointer; }
    .err { min-height: 20px; margin-top: 10px; color: #f4434f; font-size: 13px; font-weight: 700; }
  </style>
</head>
<body>
  <form id="login-form">
    <h1>관리자 로그인</h1>
    <p id="login-hint">아이디, 비밀번호, 2단계 인증 코드가 필요합니다.</p>
    <label for="login">아이디</label>
    <input id="login" name="login" autocomplete="username" required />
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <div id="totp-wrap">
      <label for="totp">2단계 인증 코드</label>
      <input id="totp" name="totp" inputmode="numeric" autocomplete="one-time-code" required maxlength="8" />
    </div>
    <button type="submit">로그인</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    fetch('/api/auth/me', { credentials: 'include' }).then((res) => {
      if (res.ok) location.replace('/nex/dashboard.html')
    }).catch(() => {})
    fetch('/api/auth/otp', { credentials: 'include' }).then(async (res) => {
      if (!res.ok) return
      const data = await res.json()
      if (data.required === false) {
        const wrap = document.getElementById('totp-wrap')
        const input = document.getElementById('totp')
        const hint = document.getElementById('login-hint')
        if (wrap) wrap.hidden = true
        if (input) input.required = false
        if (hint) hint.textContent = '아이디와 비밀번호가 필요합니다.'
      }
    }).catch(() => {})
    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault()
      const err = document.getElementById('err')
      err.textContent = ''
      const body = {
        login: document.getElementById('login').value.trim(),
        password: document.getElementById('password').value,
        totp: document.getElementById('totp').value.trim(),
      }
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        credentials: 'include',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body),
      })
      if (!res.ok) {
        const data = await res.json().catch(() => ({}))
        err.textContent = data.message || '로그인에 실패했습니다.'
        return
      }
      location.replace('/nex/dashboard.html')
    })
  </script>
</body>
</html>
